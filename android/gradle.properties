org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 reads only the new DSL unless this is set. Flutter's Gradle plugin still
# uses the legacy DSL types, so keep the opt-out.
android.newDsl=false
# The app still applies kotlin-android. Built-in Kotlin rejects that plugin.
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 still calls getDefaultProguardFile('proguard-android.txt').
android.r8.proguardAndroidTxt.disallowed=false
